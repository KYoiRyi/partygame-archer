name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore client/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Download Godot Headless
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          rm godot.zip

      - name: Download Godot Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          # Extract Android templates and source ZIP to speed up custom Gradle builds
          unzip -j templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/android_source.zip" -d ~/.local/share/godot/export_templates/4.3.stable/
          rm templates.tpz


      - name: Install Android Build Template (Manual Extraction)
        run: |
          mkdir -p client/android
          unzip -q -o ~/.local/share/godot/export_templates/4.3.stable/android_source.zip -d client/android/

      - name: Enable Cleartext Traffic in AndroidManifest.xml
        run: |
          python3 -c '
          import os
          path = "client/android/build/AndroidManifest.xml"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              if "android:usesCleartextTraffic" not in content:
                  content = content.replace("<application", "<application android:usesCleartextTraffic=\"true\"")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("usesCleartextTraffic added successfully to AndroidManifest.xml")
              else:
                  print("usesCleartextTraffic already present")
          else:
              print("AndroidManifest.xml not found")
          '

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          python3 -c '
          import os
          content = """[gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "{}"
          export/android/java_sdk_path = "{}"
          export/android/debug_keystore = "{}"
          """.format(os.environ.get("ANDROID_HOME", ""), os.environ.get("JAVA_HOME", ""), os.environ.get("GITHUB_WORKSPACE", "") + "/client/debug.keystore")
          lines = [line.strip() for line in content.splitlines()]
          with open(os.path.expanduser("~/.config/godot/editor_settings-4.tres"), "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print("Editor settings configured successfully")
          '

      - name: Export APK
        run: |
          mkdir -p dist
          ./godot --headless --path client --export-debug "Android" ../dist/archer.apk



      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Archer-MOBA-Android-APK
          path: dist/archer.apk
          if-no-files-found: error
